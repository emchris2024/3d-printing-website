services:
  website:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - 8085:80
    volumes:
      - /mnt/tank_fast/website-source/website/html:/usr/share/nginx/html:ro
      - /mnt/tank_fast/website-source/website/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      website:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
networks: {}
